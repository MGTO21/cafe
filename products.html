<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتجات مقهى Barista</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@400;700&family=Cairo:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<!-- شريط التنقل -->
<nav>
    <div class="logo">Barista</div>
    <ul>
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="#products">المنتجات</a></li>
        <li><a href="index.html#contact">تواصل معنا</a></li>
    </ul>
</nav>

<!-- أزرار التبديل -->
<div class="toggle-buttons">
    <button id="toggle-dark-mode"><i class="fas fa-moon"></i></button>
    <button id="toggle-language"><i class="fas fa-globe"></i></button>
</div>

<!-- صفحة المنتجات -->
<section class="products-page">
    <h1>منتجاتنا</h1>
    <div class="products-grid">
        <!-- المنتجات ستُضاف ديناميكيًا هنا -->
    </div>
</section>

<script src="main.js"></script>
<script>
    // Toggle dark mode
    const darkModeButton = document.getElementById("toggle-dark-mode");
    const currentTheme = localStorage.getItem("theme");
    if (currentTheme === "dark") {
        document.body.classList.add("dark-mode");
        darkModeButton.innerHTML = '<i class="fas fa-sun"></i>';
    }

    darkModeButton.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        const theme = document.body.classList.contains("dark-mode") ? "dark" : "light";
        localStorage.setItem("theme", theme);
        darkModeButton.innerHTML = theme === "dark" ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Toggle language
    const languageButton = document.getElementById("toggle-language");
    const currentLanguage = localStorage.getItem("language") || "ar";
    if (currentLanguage === "en") {
        document.body.setAttribute("lang", "en");
        translateToEnglish();
    }

    languageButton.addEventListener("click", () => {
        const lang = document.body.getAttribute("lang") === "ar" ? "en" : "ar";
        document.body.setAttribute("lang", lang);
        localStorage.setItem("language", lang);
        if (lang === "en") {
            translateToEnglish();
        } else {
            translateToArabic();
        }
    });

    // Translate to English
    function translateToEnglish() {
        document.querySelector(".logo").textContent = "Barista";
        document.querySelectorAll("nav ul li a")[0].textContent = "Home";
        document.querySelectorAll("nav ul li a")[1].textContent = "Products";
        document.querySelectorAll("nav ul li a")[2].textContent = "Contact";
        document.querySelector(".products-page h1").textContent = "Our Products";
    }

    // Translate to Arabic
    function translateToArabic() {
        document.querySelector(".logo").textContent = "Barista";
        document.querySelectorAll("nav ul li a")[0].textContent = "الرئيسية";
        document.querySelectorAll("nav ul li a")[1].textContent = "المنتجات";
        document.querySelectorAll("nav ul li a")[2].textContent = "تواصل معنا";
        document.querySelector(".products-page h1").textContent = "منتجاتنا";
    }
</script>
</body>
</html>
